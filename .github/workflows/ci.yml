name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: applycopilot
          POSTGRES_PASSWORD: applycopilot
          POSTGRES_DB: applycopilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U applycopilot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://applycopilot:applycopilot@localhost:5432/applycopilot
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-secret
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: changeme
      ADMIN_NAME: Admin
      STORAGE_PATH: ./storage
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prisma generate
        run: pnpm prisma generate
      - name: Prisma migrate
        run: pnpm prisma migrate deploy
      - name: Seed database
        run: pnpm seed
      - name: Run tests
        run: pnpm test
